name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run analysis pipeline (without rebuilding large xlsx)
        run: python -c "import run_all; run_all.main(build_excel=False, build_charts=False)"
      - name: Run tests
        run: pytest -v
